<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdfbf7">
  <title>Divertin — Sem conexão</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 18% 18%, rgba(42,157,143,.13), transparent 38%),
        radial-gradient(ellipse at 86% 82%, rgba(214,132,191,.11), transparent 40%),
        linear-gradient(135deg, #fdfbf7 0%, #e9f2ed 58%, #f7e8e7 100%);
      color: #303b38;
      font: 16px/1.6 Arial, sans-serif;
    }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(18rem, .9fr);
      align-items: center;
      gap: clamp(1rem, 4vw, 4rem);
      width: min(100%, 1540px);
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: clamp(1rem, 4vw, 4rem);
    }
    .art {
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
    }
    .art img {
      display: block;
      width: 100%;
      height: min(84dvh, 850px);
      object-fit: contain;
      filter: drop-shadow(0 20px 24px rgba(48,59,56,.08));
    }
    .copy { max-width: 650px; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: 1.2rem;
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 999px;
      padding: .6rem .95rem;
      background: rgba(255,255,255,.42);
      color: #a63d00;
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 12ch;
      margin: 0;
      font-size: clamp(2.1rem, 4.5vw, 5rem);
      font-weight: 900;
      letter-spacing: -.045em;
      line-height: .99;
      text-wrap: balance;
    }
    p { max-width: 38rem; margin: 1.3rem 0 0; color: rgba(48,59,56,.82); font-size: clamp(.95rem,1.25vw,1.2rem); line-height: 1.7; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .7rem;
      min-height: 3.5rem;
      margin-top: 2rem;
      border-radius: 999px;
      padding: .8rem 1.5rem;
      background: #2a9d8f;
      box-shadow: 0 12px 28px rgba(42,157,143,.2);
      color: #fff;
      font-size: .9rem;
      font-weight: 900;
      text-decoration: none;
      transition: transform .18s ease, background .18s ease;
    }
    a:hover { transform: translateY(-2px); background: #23877c; }
    a:focus-visible { outline: 3px solid rgba(42,157,143,.35); outline-offset: 4px; }
    @media (max-width: 760px), (orientation: portrait) and (max-width: 1024px) {
      main { grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(0,1fr) auto; gap: .5rem; padding: max(.9rem,env(safe-area-inset-top)) max(1rem,env(safe-area-inset-right)) max(1rem,env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-left)); text-align: center; }
      .art img { height: clamp(180px, 44dvh, 440px); }
      .copy { margin: 0 auto; }
      .eyebrow { margin-bottom: .75rem; font-size: .64rem; }
      h1 { max-width: 17ch; margin: 0 auto; font-size: clamp(1.8rem,7.2vw,3.15rem); }
      p { margin: .75rem auto 0; font-size: clamp(.86rem,2.65vw,1.02rem); line-height: 1.55; }
      a { min-height: 3.1rem; margin-top: 1rem; font-size: .84rem; }
    }
    @media (max-width: 900px) and (max-height: 560px) and (orientation: landscape) {
      main { grid-template-columns: minmax(0,1fr) minmax(0,.95fr); grid-template-rows: minmax(0,1fr); gap: 1rem; padding: .65rem 1.2rem; text-align: left; }
      .art img { height: 82dvh; }
      .copy { margin: 0; }
      .eyebrow { margin-bottom: .45rem; padding: .4rem .65rem; font-size: .55rem; }
      h1 { font-size: clamp(1.45rem,4.2vw,2.35rem); }
      p { margin-top: .55rem; font-size: clamp(.72rem,1.75vw,.9rem); line-height: 1.42; }
      a { min-height: 2.6rem; margin-top: .7rem; padding: .45rem 1rem; font-size: .72rem; }
    }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } }
  </style>
</head>
<body>
  <main>
    <div class="art">
      <img src="/mascote-offline-glass.webp" alt="Mascote da Divertin tentando encontrar o sinal de internet" width="1065" height="800">
    </div>
    <section class="copy" aria-labelledby="offline-title">
      <div class="eyebrow"><span aria-hidden="true">⌁</span> Conexão interrompida</div>
      <h1 id="offline-title">Ops! A internet saiu para tomar um café.</h1>
      <p>Esta página ainda não foi armazenada neste dispositivo. Volte para uma página já visitada ou tente novamente quando a conexão retornar.</p>
      <a href="/">Ir para o início <span aria-hidden="true">↗</span></a>
    </section>
  </main>
</body>
</html>
